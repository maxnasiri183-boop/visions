[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "visions-feed"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["boto3==1.40.76", "botocore>=1.40.76,<1.41", "kafka-python==2.2.15", "PyMySQL==1.1.2"]

[tool.setuptools.packages.find]
where = ["src"]
