[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "visions-operator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["Flask==3.1.2", "Werkzeug>=3.1,<4", "waitress==3.0.2", "opencv-python-headless==4.11.0.86", "numpy==1.26.4", "Pillow==11.3.0"]

[project.scripts]
visions-operator = "visions_operator.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["identity", "visions_operator"]

[tool.setuptools.package-data]
visions_operator = ["dist/*", "dist/assets/*", "dist/font/*"]
