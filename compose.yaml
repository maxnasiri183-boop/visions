services:
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:19092:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka-data:/var/lib/kafka/data]
  s3:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: ["minio"]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: visions-local
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD:?set S3_PASSWORD in .env}
    ports: ["127.0.0.1:19000:9000"]
    volumes: [crop-data:/data]
  starrocks:
    image: starrocks/allin1-ubuntu:3.4.10
    command: ["/bin/sh", "-c", "umask 022 && exec ./entrypoint.sh"]
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    ports: ["127.0.0.1:19030:9030"]
    volumes:
      - fe-meta:/data/deploy/starrocks/fe/meta
      - be-data:/data/deploy/starrocks/be/storage
  detector:
    profiles: [jobs]
    build: .
    environment:
      KAFKA_BROKERS: kafka:9092
      S3_ENDPOINT: http://s3:9000
      NO_PROXY: s3,kafka,starrocks,localhost,127.0.0.1
      no_proxy: s3,kafka,starrocks,localhost,127.0.0.1
      AWS_ACCESS_KEY_ID: visions-local
      AWS_SECRET_ACCESS_KEY: ${S3_PASSWORD:?set S3_PASSWORD in .env}
      MODEL_PATH: /input/yunet.onnx
    volumes: [./private:/input:ro]
    command: ["/input/feed.mkv", "demo-01", "5", "1.0"]
volumes:
  kafka-data: {}
  crop-data: {}
  fe-meta: {}
  be-data: {}
