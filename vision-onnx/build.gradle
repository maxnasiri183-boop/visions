plugins { id 'java-library' }
def runtimeArtifact = providers.gradleProperty('cuda').orNull == 'true' ? 'onnxruntime_gpu' : 'onnxruntime'
dependencies {
    api "com.microsoft.onnxruntime:${runtimeArtifact}:1.20.0"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.6'
}

dependencies { testImplementation 'junit:junit:4.13.2' }
