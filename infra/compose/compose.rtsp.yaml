name: visions-simulator
x-publisher: &publisher
  image: ${SIM_FFMPEG_IMAGE:-visions-review-t4:local}
  restart: unless-stopped
  init: true
  user: "${REVIEW_UID:-1000}:${REVIEW_GID:-1000}"
  entrypoint: ["/bin/sh","/sim/publish.sh"]
  volumes:
    - ./feedsimulator:/sim:ro
    - ${SIM_INPUTS:-./feed/sample_videos}:/inputs:ro
    - ./private/simulator-cache:/cache
  depends_on: [rtsp]
services:
  rtsp:
    image: bluenviron/mediamtx:1.12.3
    restart: unless-stopped
    environment:
      MTX_RTSPTRANSPORTS: tcp
      MTX_HLS: "no"
      MTX_WEBRTC: "no"
      MTX_RTMP: "no"
      MTX_SRT: "no"
  publish-shib:
    <<: *publisher
    environment: {CAMERA: shib}
  publish-shib2:
    <<: *publisher
    environment: {CAMERA: shib2}
networks:
  default:
    external: true
    name: ${VISION_NETWORK:-visions_default}
