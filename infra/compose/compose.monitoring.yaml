x-monitor-logging: &logging
  driver: json-file
  options: {max-size: "5m", max-file: "2"}

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=512MB"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - metrics-data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 4s
      retries: 4
    logging: *logging
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/operations.json
    ports: ["127.0.0.1:13000:3000"]
    volumes:
      - ./infra/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 4s
      retries: 4
    logging: *logging
  container-monitor:
    image: python:3.12-slim-bookworm
    command: ["python", "-I", "-B", "/collector.py"]
    environment:
      PROJECT: ${COMPOSE_PROJECT_NAME:-visions}
    user: "0:${REVIEW_GID:-1000}"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/monitoring/container_health.py:/collector.py:ro
      - ./private/monitor:/telemetry
    restart: unless-stopped
    logging: *logging
  gpu-monitor:
    profiles: [gpu-monitor]
    image: ubuntu:24.04
    devices: ["nvidia.com/gpu=0"]
    user: "${REVIEW_UID:-1000}:${REVIEW_GID:-1000}"
    volumes: [./private/monitor:/telemetry]
    command:
      - sh
      - -ec
      - |
        while true; do
          nvidia-smi -i 0 --query-gpu=name,utilization.gpu,memory.used,memory.total --format=csv,noheader,nounits > /telemetry/gpu.tmp
          mv /telemetry/gpu.tmp /telemetry/gpu.csv
          sleep 2
        done
    restart: unless-stopped
    logging: *logging
volumes:
  metrics-data: {}
  grafana-data: {}
