services:
  operator-exporter:
    extends:
      file: compose.feed.yaml
      service: operator-feeder
    command: ["exporter.py"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:9125/health',timeout=3)"]
      interval: 15s
      timeout: 3s
      retries: 4
  operator-soak:
    extends:
      file: compose.feed.yaml
      service: operator-feeder
    command: ["soak.py"]
    healthcheck:
      test: ["CMD","python","-c","import os,time,json,pathlib; s=json.loads((pathlib.Path('/data/soaks')/os.environ['FEED_RUN_ID']/'status.json').read_text()); assert s['outcome']=='pass' or time.time()-s['sample_at']<40"]
      interval: 20s
      timeout: 3s
      retries: 3
