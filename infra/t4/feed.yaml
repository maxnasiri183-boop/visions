x-feed: &feed
  image: ${T4_FEED_IMAGE:-visions-feed-rtsp:local}
  entrypoint: ["python"]
  build:
    target: worker
    args:
      DETECTOR_IMAGE: ${T4_DETECTOR_IMAGE:-visions-detector-gpu:latest}
services:
  operator-feeder: *feed
  operator-exporter: *feed
  operator-soak: *feed
  operator-worker:
    <<: *feed
    entrypoint: ["python", "worker.py"]
    command: []
    devices: !reset []
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
